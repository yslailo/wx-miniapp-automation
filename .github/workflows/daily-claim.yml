name: 每日领取提现券

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00（前一天）= 北京时间 06:00
  workflow_dispatch:       # 支持手动触发（抓完新 token 后立即跑一次）

# 同一时刻只跑一个领券任务，避免定时与手动触发堆叠
concurrency:
  group: daily-claim
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt --quiet

      - name: 领取提现券（最多重试 3 次）
        env:
          SESSION_TOKEN: ${{ secrets.SESSION_TOKEN }}
          USE_PROXY: ${{ secrets.USE_PROXY || '' }}
        run: |
          set +e
          for i in 1 2 3; do
            echo "========== 第 $i 次尝试 $(date -u +%Y-%m-%dT%H:%M:%SZ) =========="
            python main.py
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "✓ 领取流程完成"
              exit 0
            fi
            if [ $rc -eq 2 ]; then
              echo "::error::SESSION_TOKEN 已失效，请重新抓取并更新 Secret"
              exit 2
            fi
            if [ $i -lt 3 ]; then
              echo "第 $i 次失败（rc=$rc），60s 后重试..."
              sleep 60
            fi
          done
          echo "::error::领取失败，多次重试仍未成功"
          exit 1
